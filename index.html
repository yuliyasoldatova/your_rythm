@media (max-width: 800px) {
  html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 96px; }
  body { font-size: 15px; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .app { display: block; }
  .sidebar {
    display:block; position:fixed; inset:auto 0 0 0; width:100%; height:auto;
    padding:6px max(5px, env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom, 0px)) max(5px, env(safe-area-inset-left));
    background:rgba(255,255,255,.97); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border:0; border-top:1px solid #eae2ea; border-radius:0;
    box-shadow:0 -6px 20px rgba(60,42,66,.06);
    z-index:50; overflow:visible;
  }
  .sidebar .logo,.sidebar .sidebar-bottom { display:none; }
  .menu { display:grid; width:100%; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px; }
  .nav {
    min-width:0; width:100%; min-height:59px; padding:4px 1px; margin:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    border-radius:11px; text-align:center; font-size:10px; font-weight:700; line-height:1.1;
    white-space:normal; overflow:hidden;
  }
  .nav span { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav svg { width:21px; height:21px; flex:0 0 21px; }
  .nav.active { background:#f2edf5; color:#614e70; }
  .content { max-width:100%; padding:23px 15px calc(112px + env(safe-area-inset-bottom, 0px)); }
  .topbar { gap:8px; align-items:center; }
  .topbar .eyebrow { font-size:10px; line-height:1.35; letter-spacing:1px; }
  .topbar .pill { max-width:168px; font-size:10px; line-height:1.35; text-align:center; }
  .hero { min-height:205px; }
  .btn, .btn.small, .icon-button, .rating, .symptom, .training-type, .training-level-btn {
    -webkit-tap-highlight-color:transparent;
  }
  .btn { min-height:44px; padding:11px 14px; font-size:13px; }
  .btn.small { min-height:42px; font-size:12px; }
  .icon-button { min-width:44px; min-height:44px; }
  .rating { min-height:44px; min-width:44px; font-size:13px; }
  .rating-set { flex-wrap:wrap; }
  .form-field input,.form-field select,.form-field textarea,.field,
  input[type="date"],input[type="number"],textarea,select { font-size:16px; min-height:45px; }
  input[type="checkbox"] { width:18px; height:18px; accent-color:#73607d; }
  .symptom { min-height:42px; display:inline-flex; align-items:center; font-size:12px; }
  .stat-detail, .text-note, .rec-small, .meter-sub { font-size:11px; line-height:1.5; }

equipment/no-equipment/?page=2"},"clamshell":{"title":"Ракушка (Clamshell)","muscle":"Средняя ягодичная мышца","gear":"Коврик · по желанию мини-лента","tech":"Лёжа на боку согни колени, стопы вместе. Подними верхнее колено, не разворачивая таз назад, и медленно опусти.","cue":"Таз остаётся неподвижным; небольшая амплитуда эффективнее рывков.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"side_leg":{"title":"Отведение бедра лёжа на боку","muscle":"Средняя ягодичная мышца","gear":"Коврик","tech":"Лёжа на боку выпрями верхнюю ногу и подними её на 20–30 см; медленно опусти без поворота таза.","cue":"Не поднимай ногу за счёт прогиба поясницы.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"calf":{"title":"Подъём на носки у опоры","muscle":"Икроножные мышцы","gear":"Спинка стула","tech":"Держась за опору, поднимись на носки и плавно опусти пятки на пол.","cue":"Пропусти при боли в голеностопе; не делай через натяжение.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"wall_push":{"title":"Отжимание от стены (Wall Push-up)","muscle":"Грудь · трицепс · плечи","gear":"Стена","tech":"Положи ладони на стену на уровне груди, отойди на комфортное расстояние. Согни локти, приблизив грудь к стене, затем выжми себя обратно.","cue":"Корпус прямой; не поднимай плечи к ушам.","source":"https://www.nhs.uk/live-well/exercise/strength-and-flex-exercise-plan-how-to-videos/"},"incline_push":{"title":"Отжимание от высокой опоры","muscle":"Грудь · трицепс · плечи","gear":"Устойчивая высокая опора","tech":"Положи ладони на столешницу или устойчивую высокую поверхность. Согни локти под контролем и вернись вверх, не провисая в пояснице.","cue":"Высота опоры определяет сложность. Не используй неустойчивую мебель.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"db_floor_press":{"title":"Жим гантелей лёжа на полу","muscle":"Грудь · трицепс","gear":"Гантели · коврик","tech":"Лёжа на спине держи гантели над грудью. Опускай локти к полу под контролем, затем выжимай гантели вверх.","cue":"Запястья над локтями; не разводи локти строго в стороны.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"seated_band_press":{"title":"Жим эспандера от груди сидя","muscle":"Грудь · трицепс","gear":"Эспандер с надёжным креплением","tech":"Сядь устойчиво, расположи эспандер за спиной на уровне груди и выпрями руки вперёд. Медленно верни их обратно.","cue":"Крепление должно быть безопасным; не натуживайся.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"seated_row":{"title":"Горизонтальная тяга эспандера сидя (Seated Row)","muscle":"Широчайшие · ромбовидные · бицепс","gear":"Эспандер с надёжным креплением","tech":"Сядь прямо лицом к надёжно закреплённому эспандеру. Потяни рукояти к нижним рёбрам, ведя локти назад, затем медленно выпрями руки.","cue":"Не округляй поясницу и не поднимай плечи.","source":"https://www.acefitness.org/resources/everyone/exercise-library/48/seated-row/"},"one_arm_row":{"title":"Тяга гантели одной рукой с опорой","muscle":"Широчайшие · середина спины","gear":"Гантель · высокая опора","tech":"Опираясь свободной рукой на устойчивую поверхность, слегка отведи таз назад. Подтяни гантель к боку, затем опусти без вращения корпуса.","cue":"Сохраняй нейтральную поясницу; не дёргай вес.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"overhead_press":{"title":"Жим гантелей сидя над головой","muscle":"Дельтовидные · трицепс","gear":"Гантели · устойчивый стул","tech":"Сядь с опорой стоп, гантели у плеч. На выдохе выжми их вверх в комфортной траектории, затем медленно опусти.","cue":"Не прогибай поясницу и не задерживай дыхание.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"lateral_raise":{"title":"Разведение гантелей в стороны сидя","muscle":"Средние пучки дельт","gear":"Лёгкие гантели","tech":"Сядь с прямой спиной, локти слегка согнуты. Разведи руки примерно до уровня плеч и плавно опусти.","cue":"Поднимай руки без рывков и поднятия плеч к ушам.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"biceps":{"title":"Сгибание рук с гантелями сидя","muscle":"Бицепс","gear":"Гантели","tech":"Держи локти у корпуса, сгибай руки, поднимая гантели к плечам, затем медленно опускай.","cue":"Не раскачивай корпус; движение происходит в локтях.","source":"https://www.acefitness.org/resources/everyone/exercise-library/body-part/arms/biceps/?page=2"},"triceps":{"title":"Разгибание рук с эспандером сидя","muscle":"Трицепс","gear":"Эспандер с безопасным креплением","tech":"Прижми локти к корпусу, возьми концы эспандера и разогни руки вниз или вперёд по направлению сопротивления. Вернись медленно.","cue":"Локти стабильны, плечи не напрягай.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"face_pull":{"title":"Тяга эспандера к лицу (Face Pull)","muscle":"Задние дельты · верх спины","gear":"Эспандер с надёжной фиксацией","tech":"Потяни эспандер к уровню лица, разводя локти наружу; вернись в исходную позицию под контролем.","cue":"Не запрокидывай голову и не тяни за счёт поясницы.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"external_rot":{"title":"Наружная ротация плеча с эспандером","muscle":"Вращательная манжета плеча","gear":"Лёгкий эспандер","tech":"Локоть согнут под 90° и прижат к боку. Плавно отводи кисть в сторону, вращая плечо наружу, и возвращай назад.","cue":"Используй небольшое сопротивление и безболезненную амплитуду.","source":"https://www.acefitness.org/resources/everyone/exercise-library/equipment/resistance-bands-cables/?page=2"},"bird_dog":{"title":"Bird Dog — разноимённая рука и нога","muscle":"Стабилизаторы корпуса · ягодицы","gear":"Коврик","tech":"Из положения на четвереньках вытягивай противоположные руку и ногу до линии корпуса, затем возвращай. Меняй стороны.","cue":"Не вращай таз и не прогибай поясницу.","source":"https://www.acefitness.org/resources/everyone/exercise-library/14/bird-dog/"},"dead_bug":{"title":"Dead Bug — противоположные рука и нога","muscle":"Глубокие мышцы корпуса","gear":"Коврик","tech":"Лёжа на спине подними согнутые ноги и руки вверх. На выдохе по очереди опускай противоположные руку и ногу, сохраняя контроль поясницы.","cue":"Уменьши амплитуду, если поясница отрывается от пола.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"pelvic_tilt":{"title":"Наклон таза лёжа (Pelvic Tilt)","muscle":"Мышцы кора · контроль таза","gear":"Коврик","tech":"Лёжа с согнутыми коленями, на выдохе слегка подкрути таз, приблизив поясницу к полу; вернись в нейтраль.","cue":"Движение небольшое, без сильного давления и задержки дыхания.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"cat_cow":{"title":"Кошка–корова (Cat–Cow)","muscle":"Мобильность позвоночника","gear":"Коврик","tech":"Встань на четвереньки: с выдохом мягко округли спину, со вдохом вернись в умеренное разгибание.","cue":"Не уходи в крайние положения, особенно при дискомфорте в пояснице.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"open_book":{"title":"Раскрытие грудного отдела лёжа (Open Book)","muscle":"Подвижность грудного отдела","gear":"Коврик","tech":"Лёжа на боку с согнутыми коленями, раскрой верхнюю руку назад, позволяя грудной клетке повернуться; верни в исходное положение.","cue":"Колени остаются вместе; поворот только в комфортной амплитуде.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"thread_needle":{"title":"Продевание иглы на четвереньках","muscle":"Грудной отдел · плечевой пояс","gear":"Коврик","tech":"Из положения на четвереньках проведи одну руку под другой, мягко поверни корпус и вернись.","cue":"Не переноси вес резко на шею и плечо.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"wall_slides":{"title":"Скольжение руками по стене (Wall Slides)","muscle":"Лопатки · плечевой пояс","gear":"Стена","tech":"Встань спиной к стене или сядь у неё. Скользи предплечьями вверх и вниз, сохраняя удобное положение рёбер.","cue":"Не выгибай поясницу, если руки поднимаются выше головы.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"scapular_retraction":{"title":"Ретракция лопаток сидя","muscle":"Межлопаточные мышцы","gear":"Стул","tech":"Сидя вертикально, на выдохе сведи лопатки друг к другу и чуть вниз; удерживай 2 секунды и расслабься.","cue":"Не прижимай голову к плечам и не переразгибай поясницу.","source":"https://www.nhs.uk/live-well/exercise/sitting-exercises/"},"chest_stretch":{"title":"Раскрытие грудных мышц сидя","muscle":"Грудные мышцы · осанка","gear":"Стул","tech":"Сидя прямо, отведи плечи немного назад и вниз, разверни грудную клетку, удержи 10–15 секунд.","cue":"Не запрокидывай голову; растяжение должно быть приятным.","source":"https://www.nhs.uk/live-well/exercise/sitting-exercises/"},"seated_rotation":{"title":"Поворот грудного отдела сидя","muscle":"Грудной отдел","gear":"Стул","tech":"Сядь на переднюю часть стула; руки скрести на груди. Плавно поверни грудную клетку на небольшой угол, вернись и повтори в другую сторону.","cue":"Не скручивай поясницу через боль.","source":"https://www.nhs.uk/live-well/exercise/sitting-exercises/"},"wrist_circle":{"title":"Круговые движения кистями","muscle":"Кисти · предплечья","gear":"Без оборудования","tech":"Согни руки в локтях и медленно нарисуй кистями круги в обе стороны.","cue":"Небольшая амплитуда, без натяжения или боли.","source":"https://www.nhs.uk/live-well/exercise/sitting-exercises/"},"neck_side":{"title":"Боковое растяжение шеи","muscle":"Мышцы шеи","gear":"Стул","tech":"Сядь прямо, наклони ухо к плечу без поворота головы, удержи комфортное растяжение и смени сторону.","cue":"Не тяни голову рукой и не делай вращений шеей через запрокидывание.","source":"https://www.nhs.uk/live-well/exercise/sitting-exercises/"},"breathing":{"title":"Спокойное дыхание без задержек","muscle":"Регуляция нагрузки","gear":"Без оборудования","tech":"Устройся удобно, дыши в привычном ритме, делая спокойный мягкий выдох без усилия.","cue":"Не задерживай дыхание и не старайся дышать чрезмерно глубоко.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"march":{"title":"Ходьба на месте в низком темпе","muscle":"Аэробная выносливость","gear":"Без оборудования","tech":"Маршируй на месте с небольшой амплитудой подъёма коленей, двигая руками естественно.","cue":"Темп разговорный, без прыжков; прекрати при боли в ногах.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"walk":{"title":"Ходьба в комфортном темпе","muscle":"Аэробная выносливость","gear":"Удобная обувь","tech":"Иди с равномерным шагом и таким темпом, чтобы можно было произнести целую фразу.","cue":"При боли в колене или голеностопе не пытайся «расходиться».","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"bike":{"title":"Велотренажёр с лёгким сопротивлением","muscle":"Аэробная выносливость","gear":"Велотренажёр","tech":"Начни с низкого сопротивления и комфортного каденса, поддерживая ровное дыхание.","cue":"При боли в колене подбирай посадку со специалистом; не занимайся через боль.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"dance":{"title":"Низкоударная танцевальная аэробика","muscle":"Кардио · координация","gear":"Без оборудования","tech":"Шаги вправо-влево и вперёд-назад под музыку без подскоков; руки работают свободно.","cue":"Избегай резких поворотов, прыжков и болезненной опоры.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"seated_march":{"title":"Марш руками сидя","muscle":"Низкоинтенсивная активность верхней части тела","gear":"Устойчивый стул","tech":"Сидя прямо попеременно выноси руки вперёд и возвращай, поддерживая лёгкий, удобный ритм.","cue":"Не воспринимай как полноценную замену кардио, если ноги временно нельзя нагружать.","source":"https://www.nhs.uk/live-well/exercise/sitting-exercises/"},"child_pose":{"title":"Поза ребёнка — по переносимости","muscle":"Мягкое растяжение","gear":"Коврик","tech":"Из положения на коленях опусти таз к пяткам и вытягивай руки вперёд, только если колени и стопы не болят.","cue":"При дискомфорте в колене или голеностопе полностью исключи.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"sphinx":{"title":"Поза сфинкса","muscle":"Мягкое разгибание грудного отдела","gear":"Коврик","tech":"Лёжа на животе поставь предплечья под плечи и плавно приподними грудную клетку.","cue":"Не уходи в болезненный прогиб поясницы.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"side_bend":{"title":"Наклон корпуса в сторону сидя","muscle":"Боковые мышцы корпуса","gear":"Стул","tech":"Сидя вертикально подними одну руку и наклони грудную клетку в другую сторону на малую амплитуду.","cue":"Избегай скручивания и натуживания.","source":"https://www.nhs.uk/live-well/exercise/sitting-exercises/"},"quad_stretch":{"title":"Растяжение передней поверхности бедра стоя","muscle":"Квадрицепсы","gear":"Опора","tech":"Держась за устойчивую опору, согни колено и аккуратно приблизь пятку к ягодице, если полностью безболезненно.","cue":"Не подходит при текущей боли в колене или голеностопе.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"hamstring_seated":{"title":"Мягкая растяжка задней поверхности бедра сидя","muscle":"Задняя поверхность бедра","gear":"Устойчивый стул","tech":"Выпрями одну ногу перед собой, пятку оставь на полу. С прямой спиной слегка наклони корпус вперёд из таза до комфортного натяжения.","cue":"Не округляй поясницу и не тянусь через боль.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"},"hip_flexor":{"title":"Растяжение сгибателей бедра в выпаде","muscle":"Сгибатели бедра","gear":"Коврик","tech":"Из низкого выпада мягко подай таз вперёд без сильного прогиба поясницы.","cue":"Не выполнять при боли в колене и голеностопе.","source":"https://www.acefitness.org/resources/everyone/exercise-library/"}};

:false,"lengths":[15,27,38],"variants":[["walk","march","dance"],["bike","walk","march"],["dance","march","walk"]]},"mobility":{"title":"Мобильность · Суставы и спина","tag":"Управляемые амплитуды","icon":"✳","gear":"Стул · коврик","brief":"Плечевой пояс, грудной отдел и тазобедренные суставы — без болезненного растягивания.","level":"Мобильность","safe":true,"lengths":[12,22,30],"variants":[["wall_slides","open_book","cat_cow","scapular_retraction","wrist_circle"],["seated_rotation","chest_stretch","wall_slides","wrist_circle","neck_side"],["scapular_retraction","seated_rotation","chest_stretch","side_bend","wrist_circle"]]},"yoga":{"title":"Йога · Мягкая практика","tag":"Мягкая йога","icon":"☯","gear":"Коврик","brief":"Неспешные положения и переходы, дыхание без задержек.","level":"Мягкая","safe":false,"lengths":[15,25,35],"variants":[["cat_cow","child_pose","sphinx","open_book","breathing"],["cat_cow","thread_needle","child_pose","side_bend","breathing"],["open_book","sphinx","cat_cow","child_pose","breathing"]]},"stretch":{"title":"Стретчинг · Восстановление","tag":"Гибкость","icon":"∿","gear":"Коврик · стул","brief":"Непродолжительные растягивания без усилия и боли.","level":"Восстановительная","safe":false,"lengths":[12,20,28],"variants":[["hamstring_seated","chest_stretch","quad_stretch","neck_side","breathing"],["hip_flexor","hamstring_seated","side_bend","chest_stretch","breathing"],["quad_stretch","chest_stretch","neck_side","hamstring_seated","breathing"]]},"restore":{"title":"Восстановление · Reset","tag":"Дыхание · мягкая активность","icon":"◌","gear":"Стул · плед по желанию","brief":"Спокойное дыхание и безопасные движения верхнего плечевого пояса.","level":"Восстановительная","safe":true,"lengths":[8,15,20],"variants":[["breathing","scapular_retraction","wrist_circle","neck_side"],["breathing","chest_stretch","seated_rotation","wrist_circle"],["breathing","side_bend","scapular_retraction","neck_side"]]}};

function validRecords(){return Object.entries(state.records).filter(([d,r])=>d<=today()&&r&&typeof r==='object').sort(([a],[b])=>a.localeCompare(b))}
function average(values){const nums=values.filter(v=>typeof v==='number'&&isFinite(v));return nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null}
function drawChart(rows,key1='energy',key2='mood'){const data=rows.filter(([date,r])=>Number(r[key1])>=1||Number(r[key2])>=1).slice(-30);const W=700,H=220,pl=35,pr=15,pt=16,pb=39,pw=W-pl-pr,ph=H-pt-pb;if(!data.length)return '<div class="emptybox"><span class="shape">◌</span>Пока мало записей для графика</div>';const minDate=add(today(),-29);const x=date=>pl+Math.max(0,Math.min(29,diff(date,minDate)))/29*pw;const y=v=>pt+(5-v)/4*ph;const line=key=>data.filter(([dt,r])=>+r[key]>=1&&+r[key]<=5).map(([dt,r],i)=>`${i?'L':'M'} ${x(dt).toFixed(1)} ${y(+r[key]).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График энергии и настроения за последние 30 дней" style="width:100%;height:auto">${[1,2,3,4,5].map(n=>`<line x1="${pl}" y1="${y(n)}" x2="${W-pr}" y2="${y(n)}" stroke="#efeaf0"/><text x="18" y="${y(n)+4}" fill="#9d96a0" font-size="11">${n}</text>`).join('')}<path d="${line(key1)}" fill="none" stroke="#98b7a4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="${line(key2)}" fill="none" stroke="#b19bc8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${[key1,key2].map((k,index)=>data.filter(([dt,r])=>+r[k]>=1&&+r[k]<=5).map(([dt,r])=>`<circle cx="${x(dt)}" cy="${y(+r[k])}" r="3.8" fill="${index?'#b19bc8':'#98b7a4'}"><title>${fmt(dt)}: ${k==='energy'?'энергия':'настроение'} ${r[k]}/5</title></circle>`).join('')).join('')}<text x="${pl}" y="${H-9}" fill="#a199a4" font-size="11">${fmt(minDate,{day:'numeric',month:'short'})}</text><text x="${W-pr}" text-anchor="end" y="${H-9}" fill="#a199a4" font-size="11">${fmt(today(),{day:'numeric',month:'short'})}</text></svg>`}
function renderAnalytics(){let records=validRecords(),last30=records.filter(([d])=>diff(today(),d)<30),e=average(last30.map(([d,r])=>Number(r.energy)||null)),m=average(last30.map(([d,r])=>Number(r.mood)||null)),minutes=last30.reduce((sum,[d,r])=>sum+(Number(r.minutes)||0),0),startCount=state.profile.starts.length;const groups=['menstrual','follicular','ovulatory','luteal','premenstrual'].map(p=>({p,rs:records.filter(([dt])=>cycleAt(dt).phase===p)}));const symptomMap={};records.forEach(([d,r])=>(Array.isArray(r.symptoms)?r.symptoms:[]).forEach(s=>symptomMap[s]=(symptomMap[s]||0)+1));const sortedSymptoms=Object.entries(symptomMap).sort((a,b)=>b[1]-a[1]).slice(0,6);const a=groups.find(x=>x.p==='premenstrual'),b=groups.find(x=>x.p==='follicular'),late=average(a.rs.map(([d,r])=>Number(r.energy)||null)),fol=average(b.rs.map(([d,r])=>Number(r.energy)||null));let insight=records.length<14||a.rs.length<4||b.rs.length<4?'Чтобы увидеть личные закономерности, записывай состояние хотя бы 2–3 цикла. Пока наблюдений недостаточно для сравнения фаз.':`В записанные предменструальные дни средняя энергия ${late===null?'—':late.toFixed(1)}/5 (${a.rs.length} записей), а в фолликулярные — ${fol===null?'—':fol.toFixed(1)}/5 (${b.rs.length} записей). Это описание твоих данных, а не доказательство причины.`;
return `${head('Твоя динамика','Наблюдай за повторяющимися тенденциями, не оценивая себя по отдельному дню.')}<div class="stats"><div class="stat"><div class="stat-label">Записей всего</div><div class="stat-value">${records.length}</div><div class="stat-detail">Дней наблюдения</div></div><div class="stat"><div class="stat-label">Средняя энергия · 30 дней</div><div class="stat-value">${e===null?'—':e.toFixed(1)+'/5'}</div><div class="stat-detail">По введённым значениям</div></div><div class="stat"><div class="stat-label">Настроение · 30 дней</div><div class="stat-value">${m===null?'—':m.toFixed(1)+'/5'}</div><div class="stat-detail">Среднее значение</div></div><div class="stat"><div class="stat-label">Движение · 30 дней</div><div class="stat-value">${minutes} мин</div><div class="stat-detail">Вручную записанная активность</div></div></div><div class="card"><div class="section-title" style="margin:0 0 13px"><div><h2>Энергия и настроение</h2><p>Последние 30 дней · каждая точка — твоя запись</p></div><div class="legend"><span class="legend-item"><i style="background:#98b7a4"></i>Энергия</span><span class="legend-item"><i style="background:#b19bc8"></i>Настроение</span></div></div><div class="chart-wrap">${drawChart(last30)}</div></div><div class="grid-2" style="margin-top:17px"><div class="card"><h2 style="font-size:17px;margin:0 0 7px">Энергия по фазам</h2><p class="muted tiny">Средний балл на основании твоих записей, если они есть</p><div class="bars" style="margin-top:22px">${groups.map(g=>{let avg=average(g.rs.map(([dt,r])=>Number(r.energy)||null));return `<div><div class="barrow"><span>${P[g.p].short} · ${g.rs.length} записей</span><strong>${avg===null?'—':avg.toFixed(1)+'/5'}</strong></div><div class="barline"><i style="width:${avg===null?0:avg/5*100}%;background:${P[g.p].color}"></i></div></div>`}).join('')}</div></div><div class="card"><h2 style="font-size:17px;margin:0 0 7px">Повторяющиеся симптомы</h2><p class="muted tiny">Частота упоминаний в дневнике</p>${sortedSymptoms.length?`<div class="bars" style="margin-top:22px">${sortedSymptoms.map(([k,n])=>`<div><div class="barrow"><span>${escape(k)}</span><strong>${n}</strong></div><div class="barline"><i style="width:${n/sortedSymptoms[0][1]*100}%;background:#c5b3cb"></i></div></div>`).join('')}</div>`:'<div class="emptybox">Пока нет отмеченных симптомов</div>'}</div></div><div class="card" style="margin-top:17px"><h2 style="font-size:17px;margin:0 0 10px">Что можно заметить</h2><p class="rec-text">${insight}</p><p class="text-note">Учитывай: фазы определены по календарному прогнозу, а не подтверждены измерением гормонов. Сон, стресс, нагрузка и здоровье тоже влияют на самочувствие.</p></div><div class="card" style="margin-top:17px"><div class="section-title" style="margin:0 0 12px"><div><h2>История начала менструаций</h2><p>Здесь только даты, которые ты отметила сама · ${startCount} шт.</p></div><button class="btn outline small" data-nav="settings">Изменить →</button></div>${state.profile.starts.slice().reverse().map((dt,i)=>`<div class="history-item"><div><strong>${fmt(dt,{day:'numeric',month:'long',year:'numeric'})}</strong><div class="muted tiny">Фактическое начало ${i<state.profile.starts.length-1?'· цикл '+diff(state.profile.starts[state.profile.starts.length-1-i+1]||dt,dt)+' дней':''}</div></div><span class="pill"><span class="dot"></span> Записано</span></div>`).join('')}</div>`}
const GUIDE={menstrual:{title:'Менструация',body:['Первый день цикла — первый день полноценного кровотечения. Уровень эстрогена и прогестерона в начале менструации обычно низкий.','Некоторым людям хочется отдыхать из-за болей и усталости, а другие чувствуют себя энергично. Запретов на тренировки по одному номеру дня нет.','Если кровотечение необычно обильное или есть выраженная слабость, обсуди с врачом обследование на железодефицит.'],work:'В первые дни можно сократить занятия до 5–10 минут или отдыхать. По хорошему самочувствию — обычная нагрузка, если нет медицинских ограничений.',food:'Сохраняй белок, железосодержащие продукты и достаточное питание. Не нужны обязательные добавки железа без показаний.',life:'Планируй дополнительный отдых, если есть симптомы. Не ограничивай работу автоматически.'},follicular:{title:'Фолликулярная фаза',body:['После менструации фолликул продолжает созревать, эстроген обычно повышается.','Некоторые замечают прилив сил, но это не биологическая гарантия высокой продуктивности.','Лучшее время для прогрессии — когда достаточно сна, восстановления и нет боли, независимо от календаря.'],work:'Если есть энергия — умеренная силовая 2–3 раза за неделю с восстановлением между тренировками, плюс пилатес или удобная подвижность.',food:'Достаточное количество энергии, белка, углеводов и овощей. Не требуется специальная «фолликулярная диета».',life:'Используй ресурс для сложных задач и идей, если именно у тебя он закономерно появляется.'},ovulatory:{title:'Предполагаемая середина цикла',body:['Овуляция происходит не строго на 14-й день и не всегда одинаково в каждом цикле.','Календарная фаза — приблизительная метка, а не подтверждение произошедшей овуляции.','Сервис не вычисляет дни зачатия, не служит методом контрацепции и не подходит для планирования беременности по датам.'],work:'Продолжай привычную активность. Не нужно специально искать максимальный результат именно в это окно.',food:'Обычное сбалансированное питание и вода. Не требуется детокс или специальные добавки.',life:'Планируй дела по реальному состоянию, а не предполагаемому пику.'},luteal:{title:'Лютеиновая фаза',body:['После овуляции обычно увеличивается прогестерон, могут меняться температура тела, аппетит и качество сна.','Силовые тренировки не обязательно становятся менее эффективными. Исследования не подтверждают универсальное расписание нагрузок по фазам.','Если всё хорошо, обычную нагрузку можно сохранять.'],work:'Умеренная силовая и пилатес при хорошем самочувствии. Если восстановление ухудшилось — уменьши интенсивность или длительность.',food:'Регулярная еда и достаточные углеводы. Следи за индивидуальными сигналами голода.',life:'Старайся сохранять баланс нагрузки и сна, не навязывая себе обязательное снижение продуктивности.'},premenstrual:{title:'Предменструальные дни',body:['ПМС может включать изменения настроения, сонливость, вздутие, болезненность груди, тягу к определённым продуктам. Но он возникает не у всех.','Пищевой аппетит у некоторых женщин увеличивается во второй половине цикла. Это не повод обвинять себя в отсутствии дисциплины.','Если симптомы нарушают повседневную жизнь, обсуди их с врачом. ПМДР требует отдельной оценки и лечения.'],work:'При симптомах выбери лёгкую мобильность, прогулку либо отдых. Если чувствуешь себя хорошо — продолжай привычные силовые.',food:'Не пропускай приёмы пищи. Заранее подготовь питательные перекусы; не компенсируй дополнительную еду тренировкой.',life:'При ухудшении состояния оставь свободное время и сократи необязательные обязательства.'}};
function renderGuide(){let g=GUIDE[chosenGuide],sections=[['overview','Суть фазы'],['work','Тренировки'],['food','Питание'],['life','Дела и ресурс']];let text=activeGuide==='overview'?g.body.map(v=>`<p>${escape(v)}</p>`).join(''):`<p>${escape(g[activeGuide])}</p>`;return `${head('База знаний','Справочник фаз и персональная программа на каждый день.')}<div class="card"><span class="eyebrow">ФАЗЫ ЦИКЛА</span><div class="guide-tabs" style="margin-top:16px">${Object.keys(GUIDE).map(k=>`<button class="guide-tab ${chosenGuide===k?'active':''}" data-guide-phase="${k}">${P[k].short}</button>`).join('')}</div><div style="padding:20px;border-radius:16px;background:#faf6f8;margin-bottom:20px;border-left:5px solid ${P[chosenGuide].color}"><h2 style="font-size:22px;margin:0 0 6px">${g.title}</h2><p class="muted tiny" style="margin:0">${P[chosenGuide].subtitle}</p></div><div class="guide-tabs">${sections.map(([id,label])=>`<button class="guide-tab ${activeGuide===id?'active':''}" data-guide-tab="${id}">${label}</button>`).join('')}</div><div class="reading">${text}</div><div class="warning" style="margin-top:18px">День цикла помогает предположить фазу, но не определить гормоны или овуляцию. Рекомендации носят справочный характер, учитывай состояние и медицинские ограничения.</div></div><div class="section-title"><div><h2>Общие принципы</h2><p>Чтобы система оставалась помощником, а не списком требований</p></div></div><div class="grid-3">${cardRec('♡','Регулярность','При низком ресурсе сокращай нагрузку, а не обвиняй себя. Полный отдых тоже допустим.')}${cardRec('☀','Сила и энергия','Для прогресса полезны регулярные силовые тренировки и восстановление, а не максимальные усилия в «правильную фазу».')}${cardRec('✧','Проверяй гипотезы','Сравнивай свои записи 2–3 цикла, а не принимай универсальные советы за точный прогноз.')}</div><div class="card" style="margin-top:17px"><h2 style="font-size:17px;margin:0 0 12px">Научные источники</h2><ol class="source-list"><li><a href="https://www.acefitness.org/resources/everyone/exercise-library/" target="_blank" rel="noopener noreferrer">ACE — библиотека упражнений с техникой</a></li><li><a href="https://www.nhs.uk/live-well/exercise/how-to-improve-strength-flexibility/" target="_blank" rel="noopener noreferrer">NHS — силовые упражнения и физическая активность</a></li><li><a href="https://www.acog.org/womens-health/faqs/Premenstrual-Syndrome" target="_blank" rel="noopener noreferrer">ACOG — предменструальный синдром и дневник симптомов</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/40695607/" target="_blank" rel="noopener noreferrer">Schlie et al., 2025 — систематический обзор цикла и спортивных результатов</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7497427/" target="_blank" rel="noopener noreferrer">McNulty et al., 2020 — метаанализ тренировок и фаз</a></li></ol><p class="text-note">Внутри приложения нет внешней аналитики, аккаунтов и передачи записей. Ссылки открываются только при нажатии.</p></div>`}
function renderSettings(){const p=state.profile;return `${head('Настройки и данные','Управляй исходными датами, параметрами цикла и своими записями.')}<div class="grid-2"><div class="card"><h2 style="font-size:17px;margin:0 0 18px">Параметры цикла</h2><div class="form-grid"><div class="form-field"><label>Обычная длина цикла (дней)</label><input type="number" id="setting-cycle" min="20" max="45" value="${p.cycleLength}"/></div><div class="form-field"><label>Длительность месячных (дней)</label><input type="number" id="setting-period" min="2" max="10" value="${p.periodLength}"/></div></div><div style="margin:16px 0 13px"><label style="display:flex;gap:9px;align-items:start;font-size:12px"><input type="checkbox" id="setting-history" ${p.useHistory?'checked':''}/><span>Автоматически брать среднее из последних 3 известных циклов<br/><span class="muted tiny">Сейчас расчётная длина: ${calcLength()} дн.</span></span></label></div><hr/><h3 style="font-size:14px;margin:0 0 11px">Адаптация тренировок</h3><label style="display:flex;gap:9px;align-items:start;font-size:12px;margin-bottom:12px"><input type="checkbox" id="setting-joints" ${p.jointCare?'checked':''}/><span>Есть боль или ограничения в коленях / голеностопах</span></label><label style="display:flex;gap:9px;align-items:start;font-size:12px"><input type="checkbox" id="setting-pelvic" ${p.pelvicCare?'checked':''}/><span>Нужен щадящий режим при симптомах тазового венозного застоя</span></label><hr/><h3 style="font-size:14px;margin:0 0 12px">Атмосферные рекомендации</h3><label style="display:flex;gap:9px;align-items:start;font-size:12px"><input type="checkbox" id="setting-symbolic" ${p.showSymbolic!==false?'checked':''}/><span>Показывать времена года, аюрведические образы дош и ритуалы<br/><span class="muted tiny">Символический слой по желанию, не медицинская рекомендация.</span></span></label><button class="btn" style="margin-top:20px" data-save-settings="1">Сохранить настройки</button></div><div class="card"><h2 style="font-size:17px;margin:0 0 7px">Фактические начала менструаций</h2><p class="muted tiny">Новые даты обновляют расчёт. Нельзя удалять последнюю известную дату.</p><div class="form-field" style="margin-top:16px"><label>Добавить начало месячных</label><div class="row"><input type="date" id="new-start" max="${today()}" style="width:auto;flex:1;min-width:140px"/><button class="btn small" data-add-start="1">Добавить</button></div></div><div style="margin-top:10px">${p.starts.slice().reverse().map(d=>`<div class="history-item"><strong style="font-size:12px">${fmt(d,{day:'numeric',month:'long',year:'numeric'})}</strong><button class="btn outline small" ${p.starts.length<2?'disabled':''} data-remove-start="${d}">Удалить</button></div>`).join('')}</div></div></div><div class="card" style="margin-top:16px"><h2 style="font-size:16px;margin:0 0 7px">Подготовлено для Senim Expert</h2><p class="rec-text">В личном кабинете модуль можно предлагать женщинам-специалистам после регистрации и подключать только по их согласию. Записи цикла — чувствительные сведения: они не должны отображаться другим пользователям или администратору по умолчанию.</p><p class="text-note">Сейчас это отдельная локальная версия. Синхронизация с аккаунтом Senim Expert появится после внедрения модуля в основной проект.</p></div><div class="section-title"><div><h2>Резервная копия и приватность</h2><p>Записи сохраняются на устройстве в хранилище текущего браузера</p></div></div><div class="card"><div class="row"><button class="btn" data-export="json">${icon('download')} Скачать резервную копию JSON</button><button class="btn outline" data-export="csv">Скачать дневник CSV</button><label class="btn outline" style="cursor:pointer">Импортировать JSON<input type="file" accept="application/json,.json" id="import-file" style="display:none"/></label></div><div class="warning" style="margin:17px 0">Это локальная версия: данные не синхронизируются между устройствами и могут исчезнуть при очистке данных браузера. Если устройство общее, записи могут быть доступны другим пользователям браузера. Экспортируй JSON для резервного хранения в безопасном месте.</div><div class="row space"><p class="muted tiny">Импорт заменит текущие записи после подтверждения.</p><button class="btn danger small" data-clear-all="1">Удалить все данные</button></div></div><div class="footer">Ритм · Личный дневник, а не медицинская диагностика, метод контрацепции или инструкция по лечению.</div>`}
function render(){let root=document.getElementById('root');if(!state.profile||!state.profile.starts.length){root.innerHTML=renderSetup();bind();return}const pages={home:renderHome,program:renderProgram,calendar:renderCalendar,journal:renderJournal,analytics:renderAnalytics,guide:renderGuide,settings:renderSettings};root.innerHTML=`<div class="app">${navHTML()}<main class="main"><div class="content">${appHeader()}${state.demo?'<div class="notice"><strong>Демо-режим.</strong> Это примеры записей. Данные не сохраняются. <button class="small-link" data-exit-demo="1">Создать свой дневник →</button></div>':''}${(pages[view]||renderHome)()}</div></main></div>`;bind()}
function renderSetup(){return `<div class="setup-wrap"><div class="setup-left"><div class="logo" style="padding:0"><div class="logo-mark">☾</div><div><div class="logo-title">ритм</div><div class="logo-caption">мягкая сила</div></div></div><h1>Живи в ритме<br/><span style="color:#ad8ca3">своего тела.</span></h1><p>Красивое пространство, где календарь цикла, движение, питание и забота о себе складываются в одну систему. Без жёстких правил и чувства вины.</p><div class="setup-panel"><h2 style="font-size:19px;margin-bottom:14px">Начни с нескольких деталей</h2><div class="form-field"><label>Первый день последних месячных *</label><input id="setup-start" type="date" max="${today()}" required/></div><div class="form-grid" style="margin-top:13px"><div class="form-field"><label>Обычная длина цикла</label><select id="setup-len">${Array.from({length:26},(_,i)=>i+20).map(n=>`<option ${n===28?'selected':''} value="${n}">${n} дней</option>`).join('')}</select></div><div class="form-field"><label>Обычно идут месячные</label><select id="setup-period">${Array.from({length:9},(_,i)=>i+2).map(n=>`<option ${n===5?'selected':''} value="${n}">${n} дней</option>`).join('')}</select></div></div><label style="display:flex;gap:8px;align-items:center;font-size:11px;margin-top:16px;color:#736977"><input id="setup-joints" type="checkbox"/> Учитывать боли / ограничения суставов</label><label style="display:flex;gap:8px;align-items:center;font-size:11px;margin-top:8px;color:#736977"><input id="setup-pelvic" type="checkbox"/> Учитывать симптомы тазового венозного застоя</label><button class="btn full" style="margin-top:22px;padding:14px" data-start="1">Открыть мой календарь →</button><button class="btn outline full" style="margin-top:9px" data-demo="1">Сначала посмотреть демо</button><p style="font-size:10px;line-height:1.7;margin:14px 0">Всё работает без регистрации. Записи сохраняются только в этом браузере. Прогнозы приблизительны и не подходят для контрацепции.</p></div></div><div class="setup-right"><div class="setup-preview"><span class="chip">☾ Мой цикл</span><h3 style="margin-top:18px">Ты в своём ритме</h3><p>Каждый день — новая точка опоры</p><div class="decor">${Array.from({length:28},(_,i)=>'<i></i>').join('')}</div><div class="mini-stat"><strong style="display:block;font-size:15px;margin-bottom:3px">Забота начинается с внимания</strong><span style="color:#8e8391">Записывай своё состояние. Наблюдай динамику. Выбирай подходящую нагрузку.</span></div></div></div></div>`}
function bind(){bindWorkoutControls();document.querySelectorAll('[data-plan-today]').forEach(el=>el.onclick=()=>{selected=today();view='program';draft=null;render();window.scrollTo(0,0)});document.querySelectorAll('[data-plan-shift]').forEach(el=>el.onclick=()=>{selected=add(selected,Number(el.dataset.planShift));view='program';activeWorkoutUI.date=null;render()});document.querySelectorAll('[data-plan-day]').forEach(el=>el.onclick=()=>{selected=add(cycleAt(selected).anchor,Number(el.dataset.planDay)-1);view='program';activeWorkoutUI.date=null;render()});document.querySelectorAll('[data-save-plan]').forEach(el=>el.onclick=()=>{let date=el.dataset.savePlan;let choice=document.getElementById('plan-choice').value, done=document.getElementById('plan-done').value, notes=document.getElementById('plan-notes').value.slice(0,10000);state.planNotes=state.planNotes||{};let workoutType=document.getElementById('plan-workout-type').value,workoutLevel=document.getElementById('plan-workout-level').value;state.planNotes[date]={...state.planNotes[date],choice,done,notes,workoutType,workoutLevel};save();toast('Заметка к программе сохранена');render()});document.querySelectorAll('[data-open-day-journal]').forEach(el=>el.onclick=()=>{selected=el.dataset.openDayJournal;view='journal';draft=null;render()});document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{view=el.dataset.nav;draft=null;render();window.scrollTo(0,0)});document.querySelectorAll('[data-date]').forEach(el=>el.onclick=()=>{selected=el.dataset.date;draft=null;if(el.dataset.goto)view=el.dataset.goto;render()});document.querySelectorAll('[data-month]').forEach(el=>el.onclick=()=>{let d=parse(monthStart);d.setMonth(d.getMonth()+Number(el.dataset.month));monthStart=iso(d);render()});document.querySelectorAll('[data-shift]').forEach(el=>el.onclick=()=>{selected=add(selected,Number(el.dataset.shift));draft=null;render()});document.querySelectorAll('[data-today]').forEach(el=>el.onclick=()=>{selected=today();draft=null;render()});document.querySelectorAll('[data-rating]').forEach(el=>el.onclick=()=>{let [key,val]=el.dataset.rating.split(':');getDraft()[key]=Number(val);render()});document.querySelectorAll('[data-symptom]').forEach(el=>el.onclick=()=>{let r=getDraft(),v=el.dataset.symptom,s=new Set(r.symptoms||[]);s.has(v)?s.delete(v):s.add(v);r.symptoms=[...s];render()});document.querySelectorAll('[data-field]').forEach(el=>{el.oninput=()=>{getDraft()[el.dataset.field]=el.value};el.onchange=()=>{getDraft()[el.dataset.field]=el.value}});document.querySelectorAll('[data-entry-date]').forEach(el=>el.onchange=()=>{if(parse(el.value)&&el.value<=today()){selected=el.value;draft=null;render()}});document.querySelectorAll('[data-save-entry]').forEach(el=>el.onclick=()=>{if(selected>today())return;let r={...getDraft()};METRICS.forEach(([k])=>r[k]=goodNum(r[k],1,5,3));r.pain=goodNum(r.pain,0,5,0);r.symptoms=Array.isArray(r.symptoms)?r.symptoms.filter(x=>SYMPTOMS.includes(x)):[];['minutes','sleepHours','weight','waist'].forEach(key=>r[key]=r[key]===''?'':Math.max(0,Math.min(1000,Number(r[key])||0)));r.notes=String(r.notes||'').slice(0,10000);state.records[selected]=r;save();draft=null;toast('Запись сохранена');render()});document.querySelectorAll('[data-clear-entry]').forEach(el=>el.onclick=()=>{if(confirm('Удалить запись за '+fmt(selected)+'?')){delete state.records[selected];save();draft=null;toast('Запись удалена');render()}});document.querySelectorAll('[data-markstart]').forEach(el=>el.onclick=()=>{let d=el.dataset.markstart;if(d>today()||state.profile.starts.includes(d))return;if(confirm('Отметить '+fmt(d)+' как фактический первый день менструации?')){state.profile.starts.push(d);state.profile.starts.sort();save();toast('Начало менструации отмечено. Календарь пересчитан.');render()}});document.querySelectorAll('[data-guide-phase]').forEach(el=>el.onclick=()=>{chosenGuide=el.dataset.guidePhase;render()});document.querySelectorAll('[data-guide-tab]').forEach(el=>el.onclick=()=>{activeGuide=el.dataset.guideTab;render()});let b=document.querySelector('[data-save-settings]');if(b)b.onclick=()=>{let p=state.profile;p.cycleLength=goodNum(document.getElementById('setting-cycle').value,20,45,28);p.periodLength=goodNum(document.getElementById('setting-period').value,2,10,5);p.useHistory=document.getElementById('setting-history').checked;p.jointCare=document.getElementById('setting-joints').checked;p.pelvicCare=document.getElementById('setting-pelvic').checked;p.showSymbolic=document.getElementById('setting-symbolic').checked;save();toast('Настройки обновлены');render()};b=document.querySelector('[data-add-start]');if(b)b.onclick=()=>{let v=document.getElementById('new-start').value;if(!parse(v)||v>today()){toast('Выбери корректную дату не позднее сегодняшней');return}if(state.profile.starts.includes(v)){toast('Эта дата уже отмечена');return}state.profile.starts.push(v);state.profile.starts.sort();save();toast('Дата добавлена');render()};document.querySelectorAll('[data-remove-start]').forEach(el=>el.onclick=()=>{if(state.profile.starts.length<2)return;if(confirm('Удалить отмеченное начало '+fmt(el.dataset.removeStart)+'?')){state.profile.starts=state.profile.starts.filter(x=>x!==el.dataset.removeStart);save();toast('Дата удалена');render()}});document.querySelectorAll('[data-export]').forEach(el=>el.onclick=()=>exportData(el.dataset.export));b=document.querySelector('#import-file');if(b)b.onchange=async e=>{let f=e.target.files&&e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.profile||!Array.isArray(obj.profile.starts)||!obj.profile.starts.length)throw Error('Некорректный формат');if(!confirm('Импорт заменит все текущие настройки и записи. Продолжить?'))return;state=normalise(obj);state.demo=false;save();draft=null;view='home';toast('Данные импортированы');render()}catch(err){toast('Не удалось импортировать JSON. Проверь файл.')}};b=document.querySelector('[data-clear-all]');if(b)b.onclick=()=>{if(confirm('Безвозвратно удалить все записи и настройки из этого браузера? Сначала скачай резервную копию.')){localStorage.removeItem(KEY);state={profile:null,records:{},planNotes:{},demo:false};draft=null;view='home';render()}};b=document.querySelector('[data-start]');if(b)b.onclick=()=>{let start=document.getElementById('setup-start').value;if(!parse(start)||start>today()){toast('Сначала укажи корректную дату последних месячных');return}state=normalise({profile:{starts:[start],cycleLength:Number(document.getElementById('setup-len').value),periodLength:Number(document.getElementById('setup-period').value),jointCare:document.getElementById('setup-joints').checked,pelvicCare:document.getElementById('setup-pelvic').checked},records:{}});selected=today();save();render()};b=document.querySelector('[data-demo]');if(b)b.onclick=()=>{let start=add(today(),-23),rs={};for(let i=1;i<18;i+=2){let day=add(today(),-i);rs[day]={energy:Math.max(1,Math.min(5,Math.round(3+Math.sin(i/4)*1.3))),mood:Math.max(1,Math.min(5,Math.round(3+Math.cos(i/5)*1.3))),motivation:3,sleep:4,appetite:3,stress:2,pain:0,symptoms:[],movement:i%3===1?'pilates':'none',minutes:i%3===1?20:0,notes:''}}state=normalise({profile:{starts:[add(start,-28),start],cycleLength:28,periodLength:5,jointCare:false,pelvicCare:false},records:rs,demo:true});view='home';selected=today();render()};b=document.querySelector('[data-exit-demo]');if(b)b.onclick=()=>{state={profile:null,records:{},planNotes:{},demo:false};view='home';draft=null;render()}}
function exportData(type){if(state.demo){toast('Демо-записи не экспортируются. Создай свой дневник.');return}let data='',mime='',file='';if(type==='json'){data=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);mime='application/json';file='ritm-backup-'+today()+'.json'}else{let keys=['date','cycleDay','phase',...METRICS.map(m=>m[0]),'pain','flow','movement','minutes','sleepHours','weight','waist','symptoms','notes'];let csvCell=(v)=>{let s=String(v==null?'':v);if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};let all=[keys.join(',')];validRecords().forEach(([dt,r])=>{let c=cycleAt(dt);let d={...r,date:dt,cycleDay:c.day,phase:P[c.phase].short,symptoms:(r.symptoms||[]).join('; ')};all.push(keys.map(k=>csvCell(d[k])).join(','))});data='\uFEFF'+all.join('\r\n');mime='text/csv;charset=utf-8';file='ritm-diary-'+today()+'.csv'}let blob=new Blob([data],{type:mime});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Файл подготовлен')}
